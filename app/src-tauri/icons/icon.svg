<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)"/>

  <!-- Outline hierarchy lines -->
  <!-- Level 0 - bullet + line -->
  <circle cx="120" cy="140" r="12" fill="#63b3ed"/>
  <rect x="148" y="130" width="240" height="20" rx="10" fill="#63b3ed"/>

  <!-- Level 1 - indented -->
  <circle cx="160" cy="210" r="10" fill="#90cdf4" opacity="0.85"/>
  <rect x="184" y="201" width="200" height="18" rx="9" fill="#90cdf4" opacity="0.85"/>

  <!-- Level 2 - more indented -->
  <circle cx="200" cy="272" r="8" fill="#bee3f8" opacity="0.7"/>
  <rect x="220" y="264" width="160" height="16" rx="8" fill="#bee3f8" opacity="0.7"/>

  <!-- Level 1 - back out -->
  <circle cx="160" cy="334" r="10" fill="#90cdf4" opacity="0.85"/>
  <rect x="184" y="325" width="180" height="18" rx="9" fill="#90cdf4" opacity="0.85"/>

  <!-- Level 0 - top level again -->
  <circle cx="120" cy="396" r="12" fill="#63b3ed"/>
  <rect x="148" y="386" width="220" height="20" rx="10" fill="#63b3ed"/>
</svg>
