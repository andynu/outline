[package]
name = "outline-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "outline"
path = "src/main.rs"

[dependencies]
outline-core = { path = "../outline-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "v7"] }
chrono = "0.4"
