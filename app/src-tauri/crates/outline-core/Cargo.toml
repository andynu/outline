[package]
name = "outline-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
hostname = "0.4"
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.37"
regex = "1.10"
urlencoding = "2.1"
zip = "2.2"

[dev-dependencies]
tempfile = "3.0"
